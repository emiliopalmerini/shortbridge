[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shortbridge"
version = "0.1.0"
description = "Schedule owned YouTube Shorts or Instagram videos for TikTok publishing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nemo4" }]
dependencies = []

[project.scripts]
shortbridge = "shortbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shortbridge"]

[tool.ruff]
line-length = 100
target-version = "py311"
